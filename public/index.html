<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewMaster | Coffee Precision Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-container { background: rgba(28, 18, 14, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        #lista-brews::-webkit-scrollbar { width: 4px; }
        #lista-brews::-webkit-scrollbar-thumb { background: #3d2b1f; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#120a07] text-[#f5f0ed] min-h-screen flex items-center justify-center p-6">

    <div class="glass-container max-w-md w-full p-8 rounded-[2.5rem] border border-white/5 relative overflow-hidden shadow-2xl">
        
        <header class="text-center mb-10">
            <span class="text-[#d4a373] font-mono text-[10px] tracking-[0.4em] uppercase font-bold">Specialty Analysis</span>
            <h1 class="text-4xl font-black italic uppercase tracking-tighter mt-2 text-[#fefae0]">BrewMaster</h1>
        </header>

        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-[#d4a373] mb-3 font-bold">Café (g)</label>
                    <input type="number" id="input-cafe" placeholder="18" class="w-full bg-[#1c120e] border border-[#3d2b1f] rounded-2xl p-4 text-2xl font-bold focus:border-[#d4a373] text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-[#d4a373] mb-3 font-bold">Agua (g)</label>
                    <input type="number" id="input-agua" placeholder="36" class="w-full bg-[#1c120e] border border-[#3d2b1f] rounded-2xl p-4 text-2xl font-bold focus:border-[#d4a373] text-white outline-none">
                </div>
            </div>

            <details class="group bg-white/5 rounded-2xl border border-white/5 overflow-hidden">
                <summary class="list-none p-4 cursor-pointer flex justify-between items-center group-open:bg-white/10 transition-all">
                    <span class="text-[10px] uppercase tracking-widest text-[#d4a373] font-bold">Detalles del Grano</span>
                    <span class="text-[#d4a373] transition-transform group-open:rotate-180">▼</span>
                </summary>
                <div class="p-4 grid grid-cols-2 gap-4 border-t border-white/5 bg-[#1c120e]/50">
                    <div>
                        <label class="block text-[8px] uppercase text-white/50 mb-2">Variedad</label>
                        <select id="input-variedad" class="w-full bg-[#120a07] text-xs p-2 rounded-lg outline-none border border-white/5 focus:border-[#d4a373]">
                            <option value="Arabica">Arábica</option>
                            <option value="Robusta">Robusta</option>
                            <option value="Blend">Blend</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[8px] uppercase text-white/50 mb-2">Tueste</label>
                        <select id="input-tostado" class="w-full bg-[#120a07] text-xs p-2 rounded-lg outline-none border border-white/5 focus:border-[#d4a373]">
                            <option value="Claro">Claro</option>
                            <option value="Medio" selected>Medio</option>
                            <option value="Oscuro">Oscuro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[8px] uppercase text-white/50 mb-2">Proceso</label>
                        <select id="input-proceso" class="w-full bg-[#120a07] text-xs p-2 rounded-lg outline-none border border-white/5 focus:border-[#d4a373]">
                            <option value="Lavado">Lavado</option>
                            <option value="Natural">Natural</option>
                            <option value="Honey">Honey</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[8px] uppercase text-white/50 mb-2">Altitud (msnm)</label>
                        <input type="number" id="input-altitud" placeholder="1500" class="w-full bg-[#120a07] text-xs p-2 rounded-lg outline-none border border-white/5 focus:border-[#d4a373]">
                    </div>
                </div>
            </details>

            <button onclick="calcularExtraccion()" class="w-full bg-[#d4a373] text-[#120a07] font-black uppercase tracking-widest py-5 rounded-2xl hover:bg-[#faedcd] transition-all shadow-lg shadow-[#d4a373]/20">
                Calcular Ratio
            </button>
        </div>

        <div id="resultado" class="mt-8 pt-8 border-t border-white/5 text-center opacity-0 translate-y-4 transition-all duration-500">
            <div id="display-ratio" class="text-6xl font-black italic text-[#fefae0] my-2">1:2.0</div>
            <div id="display-msg" class="text-[10px] font-mono text-[#d4a373] uppercase tracking-widest bg-[#d4a373]/10 py-2 px-4 rounded-full inline-block">Espresso Ideal</div>
        </div>

        <div class="mt-8 pt-8 border-t border-white/5 text-center">
            <div class="relative inline-flex items-center justify-center mb-6">
                <svg class="w-32 h-32 transform -rotate-90">
                    <circle cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent" class="text-white/5" />
                    <circle id="progress-ring" cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="364.4" stroke-dashoffset="364.4" class="text-[#d4a373] transition-all duration-100 ease-linear" />
                </svg>
                <span id="timer-display" class="absolute text-3xl font-black italic text-[#fefae0]">00s</span>
            </div>
            <div class="flex gap-4">
                <button id="btn-timer" onclick="toggleTimer()" class="flex-1 border-2 border-[#d4a373] text-[#d4a373] font-black uppercase py-4 rounded-2xl hover:bg-[#d4a373] hover:text-[#120a07] transition-all">Iniciar</button>
                <button onclick="resetTimer()" class="px-6 bg-white/5 text-white/40 rounded-2xl">↺</button>
            </div>
        </div>

        <div id="ai-coach-section" class="mt-8 p-6 bg-[#d4a373]/5 rounded-[2rem] border border-[#d4a373]/20 shadow-sm">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-[#d4a373] p-2 rounded-lg text-[#120a07]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3.005 3.005 0 013.75-2.906z" /></svg>
                </div>
                <h3 class="font-bold text-[#fefae0] text-sm uppercase">AI Brew Coach</h3>
            </div>
            
            <div class="flex flex-col gap-4">

                <button id="ask-ai-btn" class="w-full py-4 bg-[#d4a373] text-[#120a07] rounded-xl font-black text-[10px] uppercase tracking-[0.2em] hover:bg-[#faedcd] transition-all">
                    Analizar Extracción con IA
                </button>

                <p id="ai-response" class="text-xs text-[#d4a373] leading-relaxed italic text-center min-h-[40px]">
                    "Tu coach está listo para analizar..."
                </p>
            </div>
        </div>

        <button onclick="guardarBrew()" class="w-full mt-6 bg-white/5 border border-white/10 text-[#fefae0] font-bold uppercase py-4 rounded-xl hover:bg-white/10 transition-all text-[10px] tracking-widest">+ Guardar en Historial</button>

        <div id="radar-container" class="mt-8 bg-white/5 p-6 rounded-[2rem] border border-white/5 hidden">
            <h3 class="text-[10px] text-[#d4a373] font-bold uppercase tracking-widest mb-4 text-center">Perfil de Sabor</h3>
            <canvas id="flavorRadar"></canvas>
        </div>

        <div id="historial-container" class="mt-10 pt-8 border-t border-white/5 hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="text-[10px] text-[#d4a373] uppercase font-bold tracking-widest">Historial</span>
                <button onclick="borrarHistorial()" class="text-[10px] text-white/20 hover:text-red-400">Limpiar</button>
            </div>
            <div id="lista-brews" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script src="./app.js"></script>
    <script src="./ai-coach.js"></script>
</body>
</html>
